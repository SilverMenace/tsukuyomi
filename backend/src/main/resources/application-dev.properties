# Local development profile:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Uses the database started by scripts/dev-db.sh.
spring.datasource.url=jdbc:postgresql://localhost:5433/tsukuyomi
spring.datasource.username=tsukuyomi
spring.datasource.password=tsukuyomi

# Local pages are served over plain http, where a Secure cookie would be dropped.
tsukuyomi.cookie.secure=false

# No proxy in front of a local server: use the connection's own address.
tsukuyomi.rate-limit.trusted-proxies=0
