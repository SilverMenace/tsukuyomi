spring.application.name=tsukuyomi

# Render (and most hosts) tell the app which port to listen on through PORT.
server.port=${PORT:8080}

# One virtual thread per request: blocking JDBC code stays simple to read
# but does not tie up a scarce platform thread while waiting on the database.
spring.threads.virtual.enabled=true

# Database. In production these come from the environment:
#   SPRING_DATASOURCE_URL       jdbc:postgresql://<host>/<db>?sslmode=require
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
# Small pool: the free database allows few connections and the app has 512 MB.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=20000

# Flyway owns our own (platform) tables. Tenant tables are managed by the
# migration engine in dev.tsukuyomi.schema, not by Flyway.
spring.flyway.default-schema=tsk_platform
spring.flyway.schemas=tsk_platform
spring.flyway.create-schemas=true

# Health endpoint for the host's health check. Only "health" is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Rate limits count requests per caller address. Behind the hosting provider's
# proxy the caller's address is in X-Forwarded-For; this says how many proxies
# in front of the app may be trusted to have written it (see ClientAddress).
tsukuyomi.rate-limit.trusted-proxies=1
