name: CI

# Runs on every branch, so work is tested before it is merged into main
# (main deploys automatically).
on:
  push:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Tests start a real PostgreSQL in Docker through Testcontainers.
      - run: ./mvnw -B verify
